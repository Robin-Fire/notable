appId: com.notiert.desktop
productName: notiert
publish:
  provider: github
  owner: Robin-Fire
  repo: notiert
  releaseType: release
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/licenses
    to: licenses
asar: true
asarUnpack:
  - "**/*.node"
win:
  icon: resources/notiert.ico
  target:
    - target: nsis
      arch: [x64]
  executableName: notiert
  artifactName: notiert-${version}-win-${arch}.${ext}
nsis:
  # Preserve the installed app identity so existing installations upgrade in place.
  guid: 4d9475c5-9ea9-5670-a918-31058aa9c876
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: notiert
  deleteAppDataOnUninstall: false
  runAfterFinish: true
