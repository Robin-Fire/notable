appId: com.notable.desktop
productName: notable
publish:
  provider: github
  owner: Robin-Fire
  repo: notable
  releaseType: release
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
extraResources:
  - from: resources/licenses
    to: licenses
asar: true
asarUnpack:
  - "**/*.node"
win:
  icon: resources/notable.ico
  target:
    - target: nsis
      arch: [x64]
  executableName: notable
  artifactName: notable-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: notable
  deleteAppDataOnUninstall: false
  runAfterFinish: true
